@if (stat()) {
<h2>{{ stat()!.title }}</h2>
<div class="chart-settings">
  <mat-slide-toggle [checked]="stat()!.smoothing ?? false" [disabled]="archived() || smoothingSaving()"
    (change)="onSmoothingChange($event.checked)">Smooth trend (7 measurements)</mat-slide-toggle>
  @if (smoothingError()) { <p class="setting-error" role="alert">{{ smoothingError() }}</p> }
</div>
<div class="chart-container">
  <app-chart [stat]="stat()!"></app-chart>
</div>
<button [routerLink]="archived() ? ['/archive'] : ['/stats']" matButton="outlined">Back</button>
<button [routerLink]="['/stats', stat()!.id, 'edit']" [disabled]="archived()" mat-flat-button>
  <mat-icon>edit</mat-icon>
  Edit
</button>
<button (click)="onArchiveToggle()" mat-flat-button>
  <mat-icon>{{ archived() ? 'unarchive' : 'archive' }}</mat-icon>
  {{ archived() ? 'Unarchive' : 'Archive' }}
</button>
<button (click)="onDelete()" mat-flat-button>
  <mat-icon>delete</mat-icon>
  Delete
</button>
} @else if (notFound()) {
<p>Statistic not found.</p>
} @else {
<p>Loading...</p>
}
