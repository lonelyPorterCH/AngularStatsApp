spring.application.name=StatsAppBackend
server.port=8081
app.stats.storage-path=/data/statistics
app.scores.storage-path=${APP_SCORES_STORAGE_PATH:${user.home}/Documents/rankedScores}
scoresaber.base-url=${SCORESABER_BASE_URL:https://scoresaber.com}
scoresaber.scores-path=${SCORESABER_SCORES_PATH:/api/v2/players/{playerId}/scores}
scoresaber.player-details-path=${SCORESABER_PLAYER_DETAILS_PATH:/api/v2/players/{playerId}}